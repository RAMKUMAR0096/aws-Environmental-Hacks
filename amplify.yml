version: 1
frontend:
  phases:
    preBuild:
      commands:
        - "[ -d \"frontend\" ] && cd frontend || true"
        - npm ci
    build:
      commands:
        - "[ -d \"frontend\" ] && cd frontend || true"
        - npm run build
        - cd .. || true
  artifacts:
    baseDirectory: frontend/out
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
